version: '3.8'

services:

  redis:
    image: redis
    container_name: redis

    ports:
      - "6379:6379"

  smartcommerce:
    image: smartcommerce

    container_name: smartcommerce

    depends_on:
      - redis

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/smartcommerce
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: manu

      SPRING_DATA_REDIS_HOST: host.docker.internal
      SPRING_DATA_REDIS_PORT: 6379